<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!--
    Original decorative keystone mark for the Montgomery County York Rite.
    A keystone (the central stone of an arch) set on a midnight field with a
    gold border. Original linework created for this site.
  -->
  <defs>
    <g id="keystone">
      <rect x="1" y="1" width="46" height="46" rx="7" fill="#101E35" stroke="#BA9555" stroke-width="2"/>
      <path d="M14 33 L19 15 H29 L34 33 Z" fill="none" stroke="#BA9555" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M24 15 V33" stroke="#BA9555" stroke-width="1.6" stroke-opacity="0.7"/>
      <path d="M12 37 H36" stroke="#BA9555" stroke-width="2.2"/>
    </g>
  </defs>
  <use href="#keystone"/>
</svg>
