<header class="site-header" data-header>
  <div class="container site-header__inner">
    <a class="brand" href="/" aria-label="{{ site.title }}, home">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="34" height="34" focusable="false">
          <use href="/assets/images/mark.svg#keystone"></use>
        </svg>
      </span>
      <span class="brand__text">
        <span class="brand__overline">Montgomery County</span>
        <span class="brand__name">York Rite</span>
        <span class="brand__sub">Royal Arch · Cryptic · Templar</span>
      </span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      {% include navigation.html variant = "desktop" %}
    </nav>

    <button class="nav-toggle" type="button"
            aria-expanded="false" aria-controls="mobile-nav"
            data-nav-toggle>
      <span class="nav-toggle__box" aria-hidden="true">
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
      </span>
      <span class="nav-toggle__label" data-nav-label>Menu</span>
    </button>
  </div>
</header>

{% include mobile-nav.html %}
